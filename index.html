<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Contínuo — Framework 3D v16</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05202b;
    --cyan:#1fd3f3;
    --purple:#9c5bf5;
    --white:#f2f6f8;
    --magenta:#ff1e8e;
    --muted:#7e98a4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Sora',system-ui,sans-serif;color:var(--white)}
  #stage{position:fixed;inset:0;cursor:grab}
  #stage.dragging{cursor:grabbing}

  .tag{position:fixed;transform:translate(-50%,-160%);font-size:10px;letter-spacing:.26em;
    text-transform:uppercase;font-weight:600;pointer-events:none;z-index:4;white-space:nowrap;
    text-shadow:0 0 16px rgba(5,32,43,.95);transition:opacity .35s;opacity:0}
  #tagCore{color:var(--white);font-weight:300;letter-spacing:.34em;text-align:center}
  #tagCore b{display:block;font-weight:600;font-size:11px}

  .ui{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:6}
  .ui button{font-family:'Sora';font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--white);background:rgba(242,246,248,.05);border:1px solid rgba(242,246,248,.18);
    padding:10px 16px;border-radius:99px;cursor:pointer;transition:all .25s;backdrop-filter:blur(6px)}
  .ui button:hover{border-color:var(--magenta);color:#fff;background:rgba(255,30,142,.12)}
  .ui button.active{border-color:var(--magenta);color:var(--magenta)}
  .ui button:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}

  /* ——— painel de ajustes ——— */
  #panel{position:fixed;top:24px;right:24px;width:248px;z-index:7;
    background:rgba(5,32,43,.82);border:1px solid rgba(242,246,248,.14);border-radius:14px;
    padding:18px 18px 14px;backdrop-filter:blur(10px);
    transform:translateX(280px);transition:transform .35s cubic-bezier(.4,0,.2,1)}
  #panel.open{transform:translateX(0)}
  #panel h2{font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:600;
    color:var(--muted);margin-bottom:14px}
  .ctrl{margin-bottom:14px}
  .ctrl label{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--white);margin-bottom:6px;font-weight:400}
  .ctrl label span{color:var(--magenta);font-weight:600;letter-spacing:.05em}
  .ctrl input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:3px;
    background:rgba(242,246,248,.18);border-radius:2px;outline:none;cursor:pointer}
  .ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;background:var(--magenta);border:2px solid var(--bg);cursor:grab}
  .ctrl input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;
    background:var(--magenta);border:2px solid var(--bg);cursor:grab}
  #panelReset{width:100%;margin-top:2px;font-family:'Sora';font-size:9px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);background:none;border:1px solid rgba(242,246,248,.14);
    padding:8px;border-radius:8px;cursor:pointer;transition:all .25s}
  #panelReset:hover{color:var(--white);border-color:rgba(242,246,248,.4)}
  @media(max-width:640px){.ui{flex-wrap:wrap;justify-content:center;width:92%}.tag{font-size:9px}
    #panel{top:12px;right:12px;width:220px}}
</style>
</head>
<body>

<div class="tag" id="tag0" style="color:var(--cyan)">Contexto Profundo</div>
<div class="tag" id="tag1" style="color:var(--white)">Comportamento Previsível</div>
<div class="tag" id="tag2" style="color:var(--purple)">Crescimento em Espiral</div>
<div class="tag" id="tagCore"><b>Informação</b>compartilhada</div>

<div id="panel">
  <h2>Ajustes</h2>
  <div class="ctrl">
    <label>Giros <span id="vTurns">3.5</span></label>
    <input type="range" id="sTurns" min="2" max="8" step="0.5" value="3.5">
  </div>
  <div class="ctrl">
    <label>Espessura da cauda <span id="vThick">0.20</span></label>
    <input type="range" id="sThick" min="0.05" max="0.60" step="0.01" value="0.20">
  </div>
  <div class="ctrl">
    <label>Opacidade da cauda <span id="vOpac">70%</span></label>
    <input type="range" id="sOpac" min="0.1" max="1" step="0.05" value="0.7">
  </div>
  <div class="ctrl">
    <label>Comprimento da espiral <span id="vLen">100%</span></label>
    <input type="range" id="sLen" min="0.5" max="1.8" step="0.05" value="1">
  </div>
  <button id="panelReset">Restaurar padrão</button>
</div>

<div class="ui">
  <button id="btnFront">Vista frontal</button>
  <button id="btnSide">Vista lateral</button>
  <button id="btnReplay">Replay</button>
  <button id="btnTags">Rótulos</button>
  <button id="btnPanel">Ajustes</button>
</div>

<div id="stage"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const BG = 0x05202b;
// ciano = Contexto Profundo · branco = Comportamento Previsível · roxo = Crescimento em Espiral
const COLORS = [0x1fd3f3, 0xf2f6f8, 0x9c5bf5];
const MAGENTA = 0xff1e8e;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ————— parâmetros controláveis pelos sliders ————— */
const DEFAULTS = {
  turns: 3.5,        // voltas em torno do eixo
  rHead: .20,        // espessura da cauda junto ao elétron
  tailOpacity: .7,   // opacidade da cauda
  lengthK: 1.0       // fator de comprimento vertical da espiral
};
const P = {...DEFAULTS};

/* ————— cena (flat, sem luzes, sem brilhos) ————— */
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 32, 78);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);

/* ————— trajetória: trifólio ascendente —————
   Projeção XZ = curva do nó trifólio. Y estritamente crescente.
   t = 0 (base) → 1 (topo)                                          */
const BASE_Y_BOT = -4.6, BASE_Y_TOP = 5.4;
const S     = 2.05;
const GROW0 = .30;
const bgColor = new THREE.Color(BG);

const yBot = () => BASE_Y_BOT * P.lengthK;
const yTop = () => BASE_Y_TOP * P.lengthK;

function trefoilAscent(rot, t, out){
  const u = t * (P.turns/2) * Math.PI * 2;          // turns/2 períodos do trifólio = turns voltas
  const g = GROW0 + (1-GROW0) * Math.pow(t, 1.1);
  const x0 = S * (Math.sin(u) + 2*Math.sin(2*u));
  const z0 = S * (Math.cos(u) - 2*Math.cos(2*u));
  const c = Math.cos(rot), s = Math.sin(rot);
  out.set(
    g * (x0*c - z0*s),
    yBot() + t*(yTop() - yBot()),
    g * (x0*s + z0*c)
  );
  return out;
}

const knotGroup = new THREE.Group();
scene.add(knotGroup);

/* ————— caudas: trajetória completa, finas, fade até quase desaparecer ————— */
const SEG = 380, RAD = 10;
const TAIL_FRAC = 1.0;

const _p=new THREE.Vector3(), _p2=new THREE.Vector3(), _t=new THREE.Vector3(),
      _n=new THREE.Vector3(), _b=new THREE.Vector3(),
      _up=new THREE.Vector3(0,1,0), _tmpC=new THREE.Color();

function makeTail(colorHex){
  const count=(SEG+1)*(RAD+1);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count*3),3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(count*3),3).setUsage(THREE.DynamicDrawUsage));
  const idx=[];
  for(let i=0;i<SEG;i++)for(let j=0;j<RAD;j++){
    const a=i*(RAD+1)+j, b=a+RAD+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  geo.setIndex(idx);
  const mesh=new THREE.Mesh(geo, new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, opacity:1}));
  mesh.frustumCulled=false;
  return {mesh, base:new THREE.Color(colorHex)};
}

function updateTail(tail, rot, tHead){
  const pos=tail.mesh.geometry.attributes.position.array;
  const col=tail.mesh.geometry.attributes.color.array;
  const rTail = Math.max(.012, P.rHead*.09);
  const EPS=.0012;
  let k=0;
  for(let i=0;i<=SEG;i++){
    const f=i/SEG;
    const t = Math.max(0, tHead - f*TAIL_FRAC);
    trefoilAscent(rot, t, _p);
    trefoilAscent(rot, Math.max(0, t-EPS), _p2);
    _t.subVectors(_p,_p2);
    if(_t.lengthSq()<1e-8)_t.set(0,1,0);
    _t.normalize();
    _n.crossVectors(_t,_up);
    if(_n.lengthSq()<1e-4)_n.set(1,0,0);
    _n.normalize();
    _b.crossVectors(_t,_n).normalize();

    // fina em quase todo o percurso; engrossa apenas perto do elétron
    const r = rTail + (P.rHead-rTail)*Math.pow(1-f, 3.6);
    // quase desaparece na origem
    _tmpC.copy(tail.base).lerp(bgColor, Math.pow(f,1.5)*.99);

    for(let j=0;j<=RAD;j++){
      const a=j/RAD*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
      pos[k]  =_p.x + r*(c*_n.x+s*_b.x);
      pos[k+1]=_p.y + r*(c*_n.y+s*_b.y);
      pos[k+2]=_p.z + r*(c*_n.z+s*_b.z);
      col[k]=_tmpC.r; col[k+1]=_tmpC.g; col[k+2]=_tmpC.b;
      k+=3;
    }
  }
  tail.mesh.geometry.attributes.position.needsUpdate=true;
  tail.mesh.geometry.attributes.color.needsUpdate=true;
}

/* três pilares ————— */
const PHASE = Math.PI*2/3;
const comets=[];
for(let i=0;i<3;i++){
  const tail=makeTail(COLORS[i]);
  knotGroup.add(tail.mesh);
  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.32, 24, 24),
    new THREE.MeshBasicMaterial({color:COLORS[i], transparent:true, opacity:1})
  );
  knotGroup.add(head);
  comets.push({tail, head, rot:i*PHASE});
}

/* ————— centro: âncora do rótulo ————— */
const coreAnchor = new THREE.Object3D();
coreAnchor.position.y = .4;
scene.add(coreAnchor);

/* ————— eixo Y magenta tracejado + seta (reconstruído quando o comprimento muda) ————— */
let axisLine=null, arrowMesh=null;
function buildAxis(){
  if(axisLine){ scene.remove(axisLine); axisLine.geometry.dispose(); }
  if(arrowMesh){ scene.remove(arrowMesh); }
  const axGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, yBot()-.6, 0), new THREE.Vector3(0, yTop()+.55, 0)
  ]);
  axisLine = new THREE.Line(axGeo, new THREE.LineDashedMaterial({
    color:MAGENTA, dashSize:.3, gapSize:.22, transparent:true, opacity:.85
  }));
  axisLine.computeLineDistances();
  scene.add(axisLine);
  if(!arrowMesh) arrowMesh = new THREE.Mesh(new THREE.ConeGeometry(.22,.55,16), new THREE.MeshBasicMaterial({color:MAGENTA}));
  arrowMesh.position.y = yTop() + .85;
  scene.add(arrowMesh);
}
buildAxis();

/* ————— câmera ————— */
let phi=.06, theta=Math.PI*.25, dist=27;
let tPhi=phi, tTheta=theta, tDist=dist;
const look=new THREE.Vector3(0,.4,0);
const PHI_SIDE=1.34, DIST_SIDE=24;
let mode='intro', clockT=0, introT=0;

function startIntro(){ mode='intro'; introT=0; phi=tPhi=.06; theta=tTheta=Math.PI*.25; dist=tDist=27; }
if(reduced){ mode='auto'; phi=tPhi=PHI_SIDE; dist=tDist=DIST_SIDE; }
else startIntro();

const ease=x=>x<0?0:x>1?1:x*x*x*(x*(x*6-15)+10);

const stage=document.getElementById('stage');
let drag=false, px=0, py=0;
stage.addEventListener('pointerdown', e=>{drag=true;px=e.clientX;py=e.clientY;stage.classList.add('dragging');mode='free';});
addEventListener('pointermove', e=>{
  if(!drag)return;
  tTheta-=(e.clientX-px)*.005;
  tPhi  -=(e.clientY-py)*.004;
  tPhi=Math.max(.05, Math.min(Math.PI-.25, tPhi));
  px=e.clientX; py=e.clientY;
});
addEventListener('pointerup', ()=>{drag=false;stage.classList.remove('dragging');});
stage.addEventListener('wheel', e=>{e.preventDefault(); mode='free'; tDist=Math.max(12,Math.min(50,tDist+e.deltaY*.02));},{passive:false});

const btn=id=>document.getElementById(id);
btn('btnFront').onclick=()=>{ mode='free'; tPhi=.06; tDist=27; };
btn('btnSide').onclick =()=>{ mode='free'; tPhi=PHI_SIDE; tDist=DIST_SIDE; };
btn('btnReplay').onclick=()=>startIntro();

let tagsOn=false;
const tagEls=[0,1,2].map(i=>document.getElementById('tag'+i));
const tagCore=document.getElementById('tagCore');
btn('btnTags').onclick=e=>{
  tagsOn=!tagsOn;
  e.currentTarget.classList.toggle('active', tagsOn);
};

/* ————— painel de sliders ————— */
const panel = document.getElementById('panel');
btn('btnPanel').onclick=e=>{
  panel.classList.toggle('open');
  e.currentTarget.classList.toggle('active', panel.classList.contains('open'));
};
function bindSlider(id, valId, fmt, apply){
  const el=document.getElementById(id), val=document.getElementById(valId);
  el.addEventListener('input', ()=>{
    const v=parseFloat(el.value);
    val.textContent=fmt(v);
    apply(v);
  });
  return el;
}
const sTurns = bindSlider('sTurns','vTurns', v=>v.toFixed(1), v=>{ P.turns=v; });
const sThick = bindSlider('sThick','vThick', v=>v.toFixed(2), v=>{ P.rHead=v; });
const sOpac  = bindSlider('sOpac','vOpac', v=>Math.round(v*100)+'%', v=>{ P.tailOpacity=v; });
const sLen   = bindSlider('sLen','vLen', v=>Math.round(v*100)+'%', v=>{ P.lengthK=v; buildAxis(); });
document.getElementById('panelReset').onclick=()=>{
  Object.assign(P, DEFAULTS);
  sTurns.value=DEFAULTS.turns;       document.getElementById('vTurns').textContent=DEFAULTS.turns.toFixed(1);
  sThick.value=DEFAULTS.rHead;       document.getElementById('vThick').textContent=DEFAULTS.rHead.toFixed(2);
  sOpac.value=DEFAULTS.tailOpacity;  document.getElementById('vOpac').textContent=Math.round(DEFAULTS.tailOpacity*100)+'%';
  sLen.value=DEFAULTS.lengthK;       document.getElementById('vLen').textContent='100%';
  buildAxis();
};

const v3=new THREE.Vector3();
function placeTag(el, obj, yOff=0, forceHide=false){
  obj.getWorldPosition(v3); v3.y+=yOff;
  v3.project(camera);
  el.style.left=((v3.x*.5+.5)*innerWidth)+'px';
  el.style.top =((-v3.y*.5+.5)*innerHeight)+'px';
  el.style.opacity=(tagsOn && v3.z<1 && !forceHide)?'1':'0';
}

/* ————— loop ————— */
const CLIMB_TIME = 18;
const SPIN = reduced ? 0 : .05;
const FADE = .07;
let last=performance.now(), climb=0;

function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clockT+=dt;
  if(!reduced) climb += dt/CLIMB_TIME;
  if(climb>=1) climb-=1;

  knotGroup.rotation.y+=SPIN*dt;

  const t = reduced ? .72 : climb;
  let fade = 1;
  if(t < FADE)        fade = t/FADE;
  else if(t > 1-FADE) fade = (1-t)/FADE;

  for(const c of comets){
    updateTail(c.tail, c.rot, t);
    c.tail.mesh.material.opacity = P.tailOpacity * fade;
    trefoilAscent(c.rot, t, _p);
    c.head.position.copy(_p);
    c.head.material.opacity = fade;
    const s = .6 + .4*fade;
    c.head.scale.set(s,s,s);
  }

  if(mode==='intro'){
    introT+=dt;
    const k=ease((introT-1.6)/7.2);
    tPhi=.06+(PHI_SIDE-.06)*k;
    tDist=27+(DIST_SIDE-27)*k;
    tTheta+=dt*.10;
    if(introT>9.4) mode='auto';
  } else if(mode==='auto'){
    tTheta+=dt*.085;
  }

  const sm=1-Math.pow(.0015,dt);
  phi+=(tPhi-phi)*sm; theta+=(tTheta-theta)*sm; dist+=(tDist-dist)*sm;

  camera.position.set(
    look.x+dist*Math.sin(phi)*Math.sin(theta),
    look.y+dist*Math.cos(phi),
    look.z+dist*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(look);

  const hideTags = fade < .5;
  comets.forEach((c,i)=>placeTag(tagEls[i], c.head, .7, hideTags));
  placeTag(tagCore, coreAnchor, .9);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
})();
</script>
</body>
</html>
