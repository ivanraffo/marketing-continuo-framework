  :root{ --ink:#eef4f7; --muted:#9fb3c2; --line:rgba(255,255,255,.14); --panel:rgba(4,14,20,.78);
         --purple:#a44dff; --cyan:#00dbff; --white:#ffffff; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:'TOTVS',system-ui,-apple-system,Segoe UI,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9));overflow:hidden}
  #stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;cursor:grab}
  #stage canvas.drag{cursor:grabbing}

  /* rótulos no estilo do framework */
  .lbl{position:absolute;left:0;top:0;z-index:2;pointer-events:none;white-space:nowrap;
       transition:opacity .6s ease;font-size:var(--lfs,16px);line-height:1.12;color:#fff}
  .lbl b{font-weight:700;display:block}
  .lbl span{font-weight:400;display:block}
  .lbl .row{display:flex;align-items:center;gap:.55em}
  .lbl svg{width:1.25em;height:1.57em;flex:none}
  .lbl.right{text-align:right}
  .lbl.center{text-align:center}
  .lbl.center .row{flex-direction:column;gap:.35em}
  .lbl.hide{opacity:0!important}
  .lbl{opacity:var(--lblfade,1)}   /* rótulos só aparecem na vista frontal */


  #title{position:absolute;left:50%;top:6.5%;transform:translateX(-50%);z-index:2;white-space:nowrap;
         font-size:var(--tfs,28px);color:#fff;letter-spacing:.005em;transition:opacity .5s}
  #title span{font-weight:400} #title b{font-weight:700}
  #logo{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);z-index:2;width:var(--lgw,240px);transition:opacity .5s}
  #logo svg{display:block;width:100%;height:auto}
  .off{opacity:0!important}
  /* painel de controles */
  #panel{position:fixed;top:16px;right:16px;width:260px;max-height:calc(100vh - 32px);overflow:auto;
         background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;
         backdrop-filter:blur(10px);z-index:10;font-size:12px}
  #panel h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:10px 0 8px}
  #panel h2:first-child{margin-top:0}
  .seg{display:flex;gap:6px}
  .seg button{flex:1}
  button{font:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);
         border-radius:9px;padding:8px 10px;cursor:pointer;transition:all .2s}
  button:hover{border-color:rgba(255,255,255,.35)}
  button.on{background:rgba(0,219,255,.14);border-color:var(--cyan)}
  .tog{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:6px}
  .tog i{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.4)}
  .tog .sw{margin-left:auto;width:30px;height:17px;border-radius:9px;background:rgba(255,255,255,.15);position:relative;flex:none;transition:background .2s}
  .tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .2s}
  .tog.on{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.3)}
  .tog.on .sw{background:var(--cyan)}
  .tog.on .sw::after{left:15px}
  .hint{color:var(--muted);font-size:11px;margin-top:8px;line-height:1.4}
  body.clean #panel{display:none}
  #show{position:fixed;top:16px;right:16px;z-index:9;display:none;opacity:.35}
  body.clean #show{display:block}
  #show:hover{opacity:1}
</style>
</head>

const items = PILLARS.map(p => {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:headTexture(p.color), transparent:true, depthWrite:false, depthTest:false }));
  sp.renderOrder = 3;
  const back = tube(), front = tube(); back.renderOrder = 2; front.renderOrder = 2.5;
  scene.add(back, front, sp);
  return { p, sp, back, front, col:new THREE.Color(p.tail), s0:sAtU(p.uEnd), k:1, target:1 };
});
const _c=new THREE.Vector3(), _a=new THREE.Vector3(), _b=new THREE.Vector3(), _T=new THREE.Vector3(), _N=new THREE.Vector3(0,1,0), _B=new THREE.Vector3();
function fillTube(it, mesh, sHead, f0, f1, sizeK, tailK, alphaK){
  const P = mesh.geometry.attributes.position.array, C = mesh.geometry.attributes.color.array;
  const R0 = HEAD_D * 0.5 * sizeK, L = TAIL_L * tailK;
  for (let j=0;j<MH;j++){
    const f = f0 + (f1-f0)*j/(MH-1), s = sHead - f*L;
    pos(s,_c); pos(s-0.02,_a); pos(s+0.02,_b); _T.subVectors(_b,_a).normalize();
    _B.crossVectors(_T,_N).normalize();                 // trilho plano: referencial estável
    const w = R0 * Math.pow(1-f, 0.85) + 0.004;
    const I = Math.min(1, Math.pow(1-f, 1.15) * 0.97) * alphaK;
    for (let r=0;r<RS;r++){
      const ang=r/RS*Math.PI*2, cx=Math.cos(ang)*w, sy=Math.sin(ang)*w, k=(j*RS+r)*3, q=(j*RS+r)*4;
      P[k]=_c.x+_B.x*cx+_N.x*sy; P[k+1]=_c.y+_B.y*cx+_N.y*sy; P[k+2]=_c.z+_B.z*cx+_N.z*sy;
      C[q]=it.col.r; C[q+1]=it.col.g; C[q+2]=it.col.b; C[q+3]=I;
    }
  }
  mesh.geometry.attributes.position.needsUpdate = true; mesh.geometry.attributes.color.needsUpdate = true;
}
const easeOutBack = x => { const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const sm = x => { x=Math.min(1,Math.max(0,x)); return x*x*(3-2*x); };

/* ---- bloom ---- */
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1920,1080), 0.22, 0.3, 0.6);
composer.addPass(bloom);

/* ---- câmera: frontal ↔ lateral (arco suave), arrastar para girar ---- */
const LOOK = new THREE.Vector3(0, 1.0, 0);
const VIEWS = { front:{ th:0.0008, az:0, dist:40.5, look:new THREE.Vector3(0,1,1.1) },
                side: { th:1.36,   az:0, dist:36, look:new THREE.Vector3(0,-0.4,0) } };
let cam = { th:VIEWS.front.th, az:0, dist:VIEWS.front.dist, look:VIEWS.front.look.clone() };
let camTarget = { ...VIEWS.front, look:VIEWS.front.look.clone() };
function applyCamera(){
  const st=Math.sin(cam.th), ct=Math.cos(cam.th);
  camera.position.set(cam.look.x + cam.dist*st*Math.sin(cam.az), cam.look.y + cam.dist*ct, cam.look.z + cam.dist*st*Math.cos(cam.az));
  camera.up.set(-ct*Math.sin(cam.az), st, -ct*Math.cos(cam.az));
  camera.lookAt(cam.look);
}
let drag=false, px=0, py=0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e=>{ drag=true; px=e.clientX; py=e.clientY; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e=>{ if(!drag) return;
  camTarget.az -= (e.clientX-px)*0.006; camTarget.th = Math.min(1.55, Math.max(0.0008, camTarget.th - (e.clientY-py)*0.005));
  px=e.clientX; py=e.clientY; setViewButtons(null); });
cv.addEventListener('pointerup', ()=>{ drag=false; cv.classList.remove('drag'); });

/* ---- rótulos (âncoras no espaço, posição do framework) ---- */
const LABELS = {
  cyan:   { el:document.getElementById('L-cyan'),   at:new THREE.Vector3( 3.58, Y1,-6.2), ax:0,   ay:-.5 },
  purple: { el:document.getElementById('L-purple'), at:new THREE.Vector3(-7.36, Y1, 0.5), ax:-1,  ay:-.5 },
  white:  { el:document.getElementById('L-white'),  at:new THREE.Vector3( 2.24, Y1, 7.04), ax:-.5, ay:0 },
  center: { el:document.getElementById('L-center'), at:new THREE.Vector3( 0,   Y1, 0),   ax:-.5, ay:-.5 },
};
const _p = new THREE.Vector3();
function placeLabels(frontal){
  const w = stage.clientWidth, h = stage.clientHeight;
  stage.style.setProperty('--lblfade', frontal.toFixed(3));
  for (const k in LABELS){ const L = LABELS[k];
    _p.copy(L.at).project(camera);
    const x = (_p.x*.5+.5)*w, y = (-_p.y*.5+.5)*h;
    L.el.style.transform = `translate(${x}px,${y}px) translate(${L.ax*100}%,${L.ay*100}%)`;
  }
}

/* ---- controles ---- */
const $ = s => document.querySelector(s);
function setViewButtons(v){ $('#vFront').classList.toggle('on', v==='front'); $('#vSide').classList.toggle('on', v==='side'); }
function goView(v){ const V = VIEWS[v]; camTarget = { th:V.th, az:0, dist:V.dist, look:V.look.clone() };
  cam.az = ((cam.az + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;   // volta pelo caminho mais curto
  setViewButtons(v); }
$('#vFront').onclick = () => goView('front');
$('#vSide').onclick  = () => goView('side');
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
  b.classList.toggle('on'); const it = items.find(i => i.p.key === b.dataset.p); it.target = b.classList.contains('on') ? 1 : 0; });
document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
  b.classList.toggle('on'); LABELS[b.dataset.l].el.classList.toggle('hide', !b.classList.contains('on')); });
$('#tTitle').onclick = () => { $('#tTitle').classList.toggle('on'); $('#title').classList.toggle('off', !$('#tTitle').classList.contains('on')); };
$('#tLogo').onclick  = () => { $('#tLogo').classList.toggle('on');  $('#logo').classList.toggle('off',  !$('#tLogo').classList.contains('on')); };
let spiralOn = 1, spiralK = 1;
$('#tSpiral').onclick = () => { $('#tSpiral').classList.toggle('on'); spiralOn = $('#tSpiral').classList.contains('on') ? 1 : 0; };
let paused = false;
const togglePause = () => { paused = !paused; $('#bPause').textContent = paused ? 'Retomar' : 'Pausar'; };
$('#bPause').onclick = togglePause;
const toggleUI = () => document.body.classList.toggle('clean');
$('#bHide').onclick = toggleUI; $('#show').onclick = toggleUI;
addEventListener('keydown', e => { if (e.key==='h'||e.key==='H') toggleUI(); if (e.code==='Space'){ e.preventDefault(); togglePause(); } });

/* ---- tamanho ---- */
function resize(){ const w = stage.clientWidth, h = stage.clientHeight;
  stage.style.setProperty('--lfs', (h*0.0205).toFixed(2)+'px');
  stage.style.setProperty('--tfs', (h*0.036).toFixed(2)+'px');
  // largura do trifólio na vista frontal (curva + espessura do tubo) → logo com 50% dela
  const pxPerWorld = h / (2*Math.tan(THREE.MathUtils.degToRad(21)) * (VIEWS.front.dist - (Y1 - VIEWS.front.look.y)));
  stage.style.setProperty('--lgw', (0.5 * TRI_W * pxPerWorld).toFixed(1)+'px');
  renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ---- loop ---- */
let T = 0, last = performance.now();
const _cd = new THREE.Vector3(), _top = new THREE.Vector3(0, Y1, 0);
function frame(now){
  const rdt = Math.min(0.25, (now-last)/1000), dt = Math.min(0.05, rdt); last = now;
  if (!paused) T += dt;
  // câmera amortecida
  const a = 1 - Math.pow(0.02, rdt);
  cam.th += (camTarget.th - cam.th)*a; cam.dist += (camTarget.dist - cam.dist)*a;
  cam.az += (camTarget.az - cam.az)*a; cam.look.lerp(camTarget.look, a);
  applyCamera();
  camera.getWorldDirection(_cd); const frontal = sm((Math.abs(_cd.y) - 0.55) / 0.35);
  // trilho em espiral
  spiralK += (spiralOn - spiralK) * (1 - Math.pow(0.03, rdt));
  for (const l of spiralLines){ l.visible = spiralK > 0.01; l.material.uniforms.uGain.value = (l===spiralLines[2]?0.62:0.95)*spiralK;
    l.material.uniforms.uNear.value = camera.position.distanceTo(_top) - 0.5; l.material.uniforms.uDepthK.value = frontal; }
  // pilares
  const sBase = (T / LOOP_S) * LTOT;
  for (const it of items){
    const step = rdt / 1.2; it.k += Math.sign(it.target - it.k) * Math.min(Math.abs(it.target - it.k), step);
    const k = it.k, on = k > 0.001;
    it.sp.visible = it.back.visible = it.front.visible = on;
    if (!on) continue;
    const entering = it.target === 1;
    const sizeK = entering ? easeOutBack(Math.min(1, k*1.25)) : sm(k);
    const tailK = Math.max(0.002, sm(k)), alphaK = Math.min(1, k*3);
    const sHead = it.s0 + sBase;
    pos(sHead, it.sp.position);
    it.sp.scale.setScalar(Math.max(0.0001, sizeK) * HEAD_D / 0.80); it.sp.material.opacity = alphaK;
    fillTube(it, it.front, sHead, 0, SPLIT, sizeK, tailK, alphaK);
    fillTube(it, it.back,  sHead, SPLIT, 1, sizeK, tailK, alphaK);
  }
  placeLabels(frontal);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* para exportar quadros: window.renderAt(t) */
window.renderAt = t => { T = t; last = performance.now(); };
})();
</script>
</body>
