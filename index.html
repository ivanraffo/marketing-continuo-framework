<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Contínuo — Framework 3D v7</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05202b;
    --cyan:#1fd3f3;
    --purple:#9c5bf5;
    --white:#f2f6f8;
    --magenta:#ff1e8e;
    --muted:#7e98a4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Sora',system-ui,sans-serif;color:var(--white)}
  #stage{position:fixed;inset:0;cursor:grab}
  #stage.dragging{cursor:grabbing}

  .tag{position:fixed;transform:translate(-50%,-160%);font-size:10px;letter-spacing:.26em;
    text-transform:uppercase;font-weight:600;pointer-events:none;z-index:4;white-space:nowrap;
    text-shadow:0 0 16px rgba(5,32,43,.95);transition:opacity .35s;opacity:0}
  #tagCore{color:var(--white);font-weight:300;letter-spacing:.34em;text-align:center}
  #tagCore b{display:block;font-weight:600;font-size:11px}

  .ui{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:6}
  .ui button{font-family:'Sora';font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--white);background:rgba(242,246,248,.05);border:1px solid rgba(242,246,248,.18);
    padding:10px 16px;border-radius:99px;cursor:pointer;transition:all .25s;backdrop-filter:blur(6px)}
  .ui button:hover{border-color:var(--magenta);color:#fff;background:rgba(255,30,142,.12)}
  .ui button.active{border-color:var(--magenta);color:var(--magenta)}
  .ui button:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
  @media(max-width:640px){.ui{flex-wrap:wrap;justify-content:center;width:92%}.tag{font-size:9px}}
</style>
</head>
<body>

<div class="tag" id="tag0" style="color:var(--cyan)">Contexto Profundo</div>
<div class="tag" id="tag1" style="color:var(--white)">Comportamento Previsível</div>
<div class="tag" id="tag2" style="color:var(--purple)">Crescimento em Espiral</div>
<div class="tag" id="tagCore"><b>Informação</b>compartilhada</div>

<div class="ui">
  <button id="btnFront">Vista frontal</button>
  <button id="btnSide">Vista lateral</button>
  <button id="btnReplay">Replay</button>
  <button id="btnTags">Rótulos</button>
</div>

<div id="stage"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const BG = 0x05202b;
// ciano = Contexto Profundo · branco = Comportamento Previsível · roxo = Crescimento em Espiral
const COLORS = [0x1fd3f3, 0xf2f6f8, 0x9c5bf5];
const MAGENTA = 0xff1e8e;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ————— cena ————— */
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 26, 62);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, .95));
const key = new THREE.DirectionalLight(0xffffff, .35);
key.position.set(6, 12, 8);
scene.add(key);

/* ————— geometria híbrida: trifólio no presente + espiral cônica no passado ————— */
const S      = 2.3;
const SY     = 1.05;
const TOP_Y  = 5.2;
const DROP   = 12.0;
const TAIL_SPAN = Math.PI*2*2.2;
const SHRINK_MIN = .10;
const bgColor = new THREE.Color(BG);

function pointAt(headU, f, out){
  const u = headU - f*TAIL_SPAN;
  const s = SHRINK_MIN + (1-SHRINK_MIN)*Math.pow(1-f, 1.25);
  out.set(
    s * S * (Math.sin(u) + 2*Math.sin(2*u)),
    TOP_Y - f*DROP - s*SY*Math.sin(3*u),
    s * S * (Math.cos(u) - 2*Math.cos(2*u))
  );
  return out;
}

/* ————— caudas de cometa finas ————— */
const SEG = 280, RAD = 8;
const R_HEAD = .26, R_TAIL = .012;

const knotGroup = new THREE.Group();
scene.add(knotGroup);

const _p=new THREE.Vector3(), _p2=new THREE.Vector3(), _t=new THREE.Vector3(),
      _n=new THREE.Vector3(), _b=new THREE.Vector3(),
      _up=new THREE.Vector3(0,1,0), _tmpC=new THREE.Color();

function makeTail(colorHex){
  const count=(SEG+1)*(RAD+1);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count*3),3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(count*3),3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(count*3),3).setUsage(THREE.DynamicDrawUsage));
  const idx=[];
  for(let i=0;i<SEG;i++)for(let j=0;j<RAD;j++){
    const a=i*(RAD+1)+j, b=a+RAD+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  geo.setIndex(idx);
  const mesh=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:.55, metalness:0}));
  mesh.frustumCulled=false;
  return {mesh, base:new THREE.Color(colorHex)};
}

function updateTail(tail, headU){
  const pos=tail.mesh.geometry.attributes.position.array;
  const nor=tail.mesh.geometry.attributes.normal.array;
  const col=tail.mesh.geometry.attributes.color.array;
  const EPS=.0015;
  let k=0;
  for(let i=0;i<=SEG;i++){
    const f=i/SEG;
    pointAt(headU, f, _p);
    pointAt(headU, Math.min(1, f+EPS), _p2);
    _t.subVectors(_p, _p2).normalize();
    _n.crossVectors(_t,_up);
    if(_n.lengthSq()<1e-4)_n.set(1,0,0);
    _n.normalize();
    _b.crossVectors(_t,_n).normalize();

    const r = R_TAIL + (R_HEAD-R_TAIL)*Math.pow(1-f, 1.9);
    _tmpC.copy(tail.base).lerp(bgColor, Math.pow(f,.8)*.97);

    for(let j=0;j<=RAD;j++){
      const a=j/RAD*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
      const nx=c*_n.x+s*_b.x, ny=c*_n.y+s*_b.y, nz=c*_n.z+s*_b.z;
      pos[k]=_p.x+r*nx; pos[k+1]=_p.y+r*ny; pos[k+2]=_p.z+r*nz;
      nor[k]=nx; nor[k+1]=ny; nor[k+2]=nz;
      col[k]=_tmpC.r; col[k+1]=_tmpC.g; col[k+2]=_tmpC.b;
      k+=3;
    }
  }
  tail.mesh.geometry.attributes.position.needsUpdate=true;
  tail.mesh.geometry.attributes.normal.needsUpdate=true;
  tail.mesh.geometry.attributes.color.needsUpdate=true;
}

/* glow sprites */
function glowTexture(r,g,b,a=.6){
  const cv=document.createElement('canvas'); cv.width=cv.height=128;
  const cx=cv.getContext('2d');
  const gr=cx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(${r},${g},${b},${a})`);
  gr.addColorStop(.45,`rgba(${r},${g},${b},${a*.25})`);
  gr.addColorStop(1,'rgba(5,32,43,0)');
  cx.fillStyle=gr; cx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(cv);
}

/* três cometas defasados 120° */
const PHASE=Math.PI*2/3;
const comets=[];
for(let i=0;i<3;i++){
  const tail=makeTail(COLORS[i]);
  knotGroup.add(tail.mesh);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.42,32,32),
    new THREE.MeshStandardMaterial({color:COLORS[i], emissive:COLORS[i], emissiveIntensity:.45, roughness:.35})
  );
  knotGroup.add(head);

  const c=new THREE.Color(COLORS[i]);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({
    map:glowTexture(Math.round(c.r*255),Math.round(c.g*255),Math.round(c.b*255)),
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  }));
  glow.scale.setScalar(2.6);
  knotGroup.add(glow);

  comets.push({tail, head, glow, phase:i*PHASE, baseGlow:2.6});
}

/* ═════════ CAMPO GERADOR DE ONDAS (substitui a esfera do núcleo) ═════════ */
const fieldGroup = new THREE.Group();
fieldGroup.position.y = TOP_Y;
scene.add(fieldGroup);

// âncora invisível para o rótulo "Informação"
const coreAnchor = new THREE.Object3D();
coreAnchor.position.y = TOP_Y;
scene.add(coreAnchor);

// brilho central pulsante (fonte de emissão, sem corpo sólido)
const emitterGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map:glowTexture(195,238,255,.7), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
}));
emitterGlow.scale.setScalar(2.2);
fieldGroup.add(emitterGlow);

const emitterPoint = new THREE.Sprite(new THREE.SpriteMaterial({
  map:glowTexture(255,255,255,.95), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
}));
emitterPoint.scale.setScalar(.9);
fieldGroup.add(emitterPoint);

// ondas concêntricas contidas na área interna, onde estão os 3 pilares (como na referência)
const WAVE_MAX_R = 3.3;          // alcance restrito ao miolo do trifólio
const WAVE_CYCLE = 3.4;          // segundos por onda
const N_WAVES = 7;
const waves = [];
const waveMat = () => new THREE.MeshBasicMaterial({
  color:0x8fc4d6, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false
});
for(let i=0;i<N_WAVES;i++){
  const ringMesh = new THREE.Mesh(new THREE.RingGeometry(.975, 1, 96), waveMat());
  ringMesh.rotation.x = -Math.PI/2;
  fieldGroup.add(ringMesh);
  waves.push({mesh:ringMesh, offset: i/N_WAVES});
}

// pulsos de energia: partículas que saem do campo e alimentam cada pilar
const PULSES_PER = 2;
const pulses = [];
for(let i=0;i<3;i++){
  const c=new THREE.Color(COLORS[i]);
  for(let k=0;k<PULSES_PER;k++){
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map:glowTexture(Math.round(c.r*255),Math.round(c.g*255),Math.round(c.b*255),.9),
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
    }));
    sp.scale.setScalar(.7);
    scene.add(sp);
    pulses.push({sprite:sp, comet:i, t: (k/PULSES_PER + i*.16) % 1, speed: .55 + Math.random()*.12});
  }
}
const _origin = new THREE.Vector3(0, TOP_Y, 0);
const _target = new THREE.Vector3();
const easeIO = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
/* ═════════════════════════════════════════════════════════════════════ */

/* ————— eixo Y magenta tracejado + seta ————— */
{
  const axGeo=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, TOP_Y-DROP-1.4, 0), new THREE.Vector3(0, TOP_Y+4.4, 0)
  ]);
  const axis=new THREE.Line(axGeo, new THREE.LineDashedMaterial({
    color:MAGENTA, dashSize:.32, gapSize:.24, transparent:true, opacity:.8
  }));
  axis.computeLineDistances();
  scene.add(axis);
  const arrow=new THREE.Mesh(new THREE.ConeGeometry(.26,.66,16), new THREE.MeshBasicMaterial({color:MAGENTA}));
  arrow.position.y=TOP_Y+4.7;
  scene.add(arrow);
}

/* ————— câmera: frontal → lateral ————— */
let phi=.06, theta=Math.PI*.25, dist=29;
let tPhi=phi, tTheta=theta, tDist=dist;
const lookFront=new THREE.Vector3(0,TOP_Y,0);
const lookSide =new THREE.Vector3(0,.2,0);
const lookCur=lookFront.clone(); let lookMix=0, tLookMix=0;
const PHI_SIDE=1.34, DIST_SIDE=27;
let mode='intro', clockT=0, introT=0;

function startIntro(){ mode='intro'; introT=0; phi=tPhi=.06; theta=tTheta=Math.PI*.25; dist=tDist=29; lookMix=tLookMix=0; }
if(reduced){ mode='auto'; phi=tPhi=PHI_SIDE; dist=tDist=DIST_SIDE; lookMix=tLookMix=1; }
else startIntro();

const ease=x=>x<0?0:x>1?1:x*x*x*(x*(x*6-15)+10);

const stage=document.getElementById('stage');
let drag=false, px=0, py=0;
stage.addEventListener('pointerdown', e=>{drag=true;px=e.clientX;py=e.clientY;stage.classList.add('dragging');mode='free';});
addEventListener('pointermove', e=>{
  if(!drag)return;
  tTheta-=(e.clientX-px)*.005;
  tPhi  -=(e.clientY-py)*.004;
  tPhi=Math.max(.05, Math.min(Math.PI-.25, tPhi));
  px=e.clientX; py=e.clientY;
});
addEventListener('pointerup', ()=>{drag=false;stage.classList.remove('dragging');});
stage.addEventListener('wheel', e=>{e.preventDefault(); mode='free'; tDist=Math.max(13,Math.min(52,tDist+e.deltaY*.02));},{passive:false});

const btn=id=>document.getElementById(id);
btn('btnFront').onclick=()=>{ mode='free'; tPhi=.06; tDist=29; tLookMix=0; };
btn('btnSide').onclick =()=>{ mode='free'; tPhi=PHI_SIDE; tDist=DIST_SIDE; tLookMix=1; };
btn('btnReplay').onclick=()=>startIntro();

let tagsOn=false;
const tagEls=[0,1,2].map(i=>document.getElementById('tag'+i));
const tagCore=document.getElementById('tagCore');
btn('btnTags').onclick=e=>{
  tagsOn=!tagsOn;
  e.currentTarget.classList.toggle('active', tagsOn);
};

const v3=new THREE.Vector3();
function placeTag(el, obj, yOff=0){
  obj.getWorldPosition(v3); v3.y+=yOff;
  v3.project(camera);
  el.style.left=((v3.x*.5+.5)*innerWidth)+'px';
  el.style.top =((-v3.y*.5+.5)*innerHeight)+'px';
  el.style.opacity=(tagsOn && v3.z<1)?'1':'0';
}

/* ————— loop ————— */
const FLOW=reduced?0:.42;
const SPIN=reduced?0:.05;
let last=performance.now(), travel=0;

function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clockT+=dt; travel+=FLOW*dt;

  knotGroup.rotation.y+=SPIN*dt;
  const breathe=1+(reduced?0:.025*Math.sin(clockT*.65));
  knotGroup.scale.set(breathe,1,breathe);

  for(const c of comets){
    const u=travel+c.phase;
    updateTail(c.tail, u);
    pointAt(u, 0, _p);
    c.head.position.copy(_p);
    c.glow.position.copy(_p);
  }

  /* — campo gerador de ondas (contido no miolo) — */
  const beat = (clockT % WAVE_CYCLE) / WAVE_CYCLE;
  emitterGlow.scale.setScalar(2.2 + .8*Math.exp(-beat*4));         // pulsa a cada emissão
  emitterPoint.material.opacity = .5 + .4*Math.exp(-beat*4);

  for(const w of waves){
    const k = ((clockT/WAVE_CYCLE) + w.offset) % 1;                 // 0 → 1
    const r = .3 + Math.pow(k,.85)*WAVE_MAX_R;
    w.mesh.scale.setScalar(r);
    w.mesh.material.opacity = (reduced? .2 : .38) * Math.pow(1-k, 1.4);
  }

  // pulsos de energia: do campo central até cada pilar (e o pilar acende ao receber)
  for(const c of comets) c.targetBoost = 0;
  for(const pu of pulses){
    pu.t += dt*pu.speed;
    if(pu.t>=1) pu.t-=1;
    const c = comets[pu.comet];
    c.head.getWorldPosition(_target);
    const e = easeIO(pu.t);
    pu.sprite.position.lerpVectors(_origin, _target, e);
    pu.sprite.material.opacity = Math.sin(pu.t*Math.PI)*.95;
    pu.sprite.scale.setScalar(.45 + .45*Math.sin(pu.t*Math.PI));
    if(pu.t>.9) c.targetBoost = Math.max(c.targetBoost||0, (pu.t-.9)/.1);
  }
  for(const c of comets){
    const boost = c.targetBoost||0;
    c.glow.scale.setScalar(c.baseGlow + boost*1.2);                 // pilar "se alimenta"
    c.head.material.emissiveIntensity = .45 + boost*.5;
  }

  if(mode==='intro'){
    introT+=dt;
    const k=ease((introT-1.6)/7.2);
    tPhi=.06+(PHI_SIDE-.06)*k;
    tDist=29+(DIST_SIDE-29)*k;
    tTheta+=dt*.10;
    tLookMix=k;
    if(introT>9.4) mode='auto';
  } else if(mode==='auto'){
    tTheta+=dt*.085;
  }

  const sm=1-Math.pow(.0015,dt);
  phi+=(tPhi-phi)*sm; theta+=(tTheta-theta)*sm; dist+=(tDist-dist)*sm; lookMix+=(tLookMix-lookMix)*sm;

  lookCur.lerpVectors(lookFront, lookSide, lookMix);
  camera.position.set(
    lookCur.x+dist*Math.sin(phi)*Math.sin(theta),
    lookCur.y+dist*Math.cos(phi),
    lookCur.z+dist*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(lookCur);

  comets.forEach((c,i)=>placeTag(tagEls[i], c.head, .75));
  placeTag(tagCore, coreAnchor, 1.15);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
})();
</script>
</body>
</html>
